name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [feature/macos-build]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Daevu-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
